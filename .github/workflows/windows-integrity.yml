name: Windows integrity

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  secret-and-artifact-checks:
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Select review range
        id: range
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $empty = git hash-object -t tree NUL
          if ($env:EVENT_NAME -eq 'pull_request' -and $env:BASE_SHA) {
            $base = $env:BASE_SHA
          } elseif ($env:BEFORE_SHA -and $env:BEFORE_SHA -notmatch '^0+$') {
            git cat-file -e "$env:BEFORE_SHA^{commit}" 2>$null
            $base = if ($LASTEXITCODE -eq 0) { $env:BEFORE_SHA } else { $empty }
          } else {
            # A new branch push has an all-zero before SHA. Review the tip commit
            # when it has a parent; use the empty tree only for a true root commit.
            git cat-file -e 'HEAD^{commit}' 2>$null
            git cat-file -e 'HEAD^' 2>$null
            $base = if ($LASTEXITCODE -eq 0) { git rev-parse 'HEAD^' } else { $empty }
          }
          "base=$base" >> $env:GITHUB_OUTPUT

      - name: Validate repository text
        shell: pwsh
        env:
          BASE: ${{ steps.range.outputs.base }}
        run: |
          git diff --check $env:BASE HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed.' }

          $rules = [ordered]@{
            aws         = 'AKIA[0-9A-Z]{16}'
            github      = '(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})'
            openai      = 'sk-[A-Za-z0-9_-]{20,}'
            private_key = '-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----'
            bearer      = 'Bearer[ ]+[A-Za-z0-9._~+/=-]{24,}'
          }
          $findings = [System.Collections.Generic.List[string]]::new()
          foreach ($rule in $rules.GetEnumerator()) {
            $paths = @(git grep -I -l -E -- $rule.Value -- . 2>$null)
            if ($LASTEXITCODE -gt 1) { throw "git grep failed for $($rule.Key)." }
            foreach ($path in $paths) { $findings.Add("$($rule.Key):$path") }
          }
          if ($findings.Count -ne 0) {
            $findings | Sort-Object -Unique | Write-Error
            throw 'High-confidence secret pattern detected.'
          }
          exit 0

      - name: Reject local and generated artifacts
        shell: pwsh
        run: |
          $pattern = '(?i)(^|/)(\.codex|\.agents|sessions|memory|results)(/|$)|(^|/)\.mcp\.json$|(^|/)(auth|credentials|tokens|oauth)\.json$|(^|/)\.env($|\.)|\.(exe|dll|pdb|ncu-rep|nsys-rep|dmp|trace|sqlite|db|ninfer|ckpt|onnx|pt|pth|npy|npz|safetensors|gguf)$'
          $blocked = @(git ls-files | Where-Object { $_ -match $pattern })
          if ($blocked.Count -ne 0) {
            $blocked | Write-Error
            throw 'Local, credential, model, result, binary, or profiler artifact is tracked.'
          }

      - name: Validate documentation links
        shell: pwsh
        run: |
          python tools/maintenance/check_markdown_links.py README.md docs evidence
          if ($LASTEXITCODE -ne 0) { throw 'Documentation link validation failed.' }
